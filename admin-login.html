<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Harista Interiors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#182241',
                        sand: '#D0E0CD',
                        oat: '#7B949C',
                        oak: '#536C7C',
                        gold: '#D0E0CD'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        luxury: '0 18px 60px rgba(34,35,31,.14)'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="assests/logo.png" />

    <style>
        :root {
            --ink: #182241;
            --deep: #213C4E;
            --mint: #D9E5D7;
            --soft-mint: #D0E0CD;
            --blue-grey: #7B949C;
            --slate: #536C7C;
            --white-mint: #F4F7F1;
            --line: rgba(83, 108, 124, .28);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--mint) !important;
            color: var(--ink);
            overflow-x: hidden;
        }

        .display {
            font-family: 'Playfair Display', Georgia, serif;
        }

        .logo-image {
            mix-blend-mode: multiply;
        }

        /* Glassmorphism header */
        header {
            position: fixed !important;
            top: .85rem !important;
            left: 1rem !important;
            right: 1rem !important;
            z-index: 1000 !important;
            height: 4.35rem !important;
            overflow: hidden !important;
            border: 1px solid rgba(255, 255, 255, .48) !important;
            border-radius: 1.15rem !important;
            background: linear-gradient(115deg, rgba(255, 255, 255, .34) 0%, rgba(244, 247, 241, .20) 42%, rgba(208, 224, 205, .16) 100%) !important;
            backdrop-filter: blur(22px) saturate(135%) !important;
            -webkit-backdrop-filter: blur(22px) saturate(135%) !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72), inset 0 -1px 0 rgba(83, 108, 124, .14), 0 10px 25px rgba(24, 34, 65, .08), 0 24px 55px rgba(24, 34, 65, .10) !important;
            isolation: isolate;
        }

        header::before {
            position: absolute; inset: 0; content: ''; z-index: -1; pointer-events: none;
            background: linear-gradient(105deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.08) 22%, transparent 48%, rgba(255,255,255,.10) 78%, transparent 100%);
            opacity: .8;
        }

        header::after {
            position: absolute; inset: 1px; content: ''; z-index: -1; pointer-events: none;
            border: 1px solid rgba(255,255,255,.16); border-radius: 1.05rem;
        }

        header nav { position: relative; z-index: 2; height: 4.35rem !important; }
        header nav a:not([href*="wa.me"]) { position: relative; color: var(--ink) !important; transition: color .25s ease, opacity .25s ease, transform .25s ease; text-decoration: none; }
        header nav a:not([href*="wa.me"]):hover { opacity: .72; transform: translateY(-1px); }
        header nav a:not([href*="wa.me"])::after { display: block; width: 0; height: 1px; margin-top: 4px; content: ''; background: var(--slate); opacity: .65; transition: width .25s ease; }
        header nav a:not([href*="wa.me"]):hover::after { width: 100%; }

        /* Glass login card */
        .login-card {
            border: 1px solid rgba(83, 108, 124, .45);
            border-radius: 1.5rem;
            background: linear-gradient(110deg, rgba(217,229,215,.48), rgba(208,224,205,.34));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 30px 75px rgba(0,0,0,.12);
            backdrop-filter: blur(14px);
        }

        .login-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 1px solid rgba(83, 108, 124, .35);
            border-radius: .8rem;
            background: rgba(244, 247, 241, .6);
            color: var(--ink);
            font-size: .95rem;
            transition: border-color .3s ease, box-shadow .3s ease;
            outline: none;
        }

        .login-input::placeholder { color: var(--blue-grey); opacity: .7; }
        .login-input:focus {
            border-color: var(--slate);
            box-shadow: 0 0 0 3px rgba(83, 108, 124, .15);
        }

        .login-btn {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.32);
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(24,34,65,.96), rgba(33,60,78,.88));
            color: #F4F7F1;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.20), 0 8px 20px rgba(24,34,65,.16);
            transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, background .3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(33,60,78,.98), rgba(24,34,65,.96));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 12px 28px rgba(24,34,65,.20);
        }

        .login-btn::before {
            position: absolute; top: 0; bottom: 0; left: -65%; width: 45%; content: '';
            transform: skewX(-20deg);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
            transition: left .6s ease;
        }

        .login-btn:hover::before { left: 125%; }

        /* Decorative background orbs */
        body::before {
            position: fixed; z-index: -1; top: 14vh; right: -19vw;
            width: 44vw; height: 44vw; content: ''; border-radius: 50%;
            background: radial-gradient(circle, rgba(123,148,156,.24), transparent 68%);
            filter: blur(2px);
            animation: orbit 18s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes orbit { to { transform: translate(-8vw, 7vh) scale(1.15); } }

        .error-alert {
            border: 1px solid rgba(220, 38, 38, .35);
            border-radius: .8rem;
            background: rgba(254, 226, 226, .6);
            color: #991b1b;
        }

        /* =========================================
           HARISTA BRAND LOCKUP — EXACT FROM HOME PAGE
           ========================================= */

        header a[aria-label="Harista Interiors home"]>span>span:first-child,
        header a:first-child>span>span:first-child {
            font-size: 26px !important;
            font-weight: 800 !important;
            letter-spacing: .18em !important;
            line-height: 1 !important;
        }

        header a[aria-label="Harista Interiors home"]>span>span:last-child,
        header a:first-child>span>span:last-child {
            margin-top: 6px !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            letter-spacing: .20em !important;
            line-height: 1 !important;
        }

        @media (max-width: 768px) {
            header a[aria-label="Harista Interiors home"] > span > span:first-child,
            header a:first-child > span > span:first-child {
                font-size: 1.08rem !important;
                letter-spacing: .13em !important;
            }

            header a[aria-label="Harista Interiors home"] > span > span:last-child,
            header a:first-child > span > span:last-child {
                margin-top: 3px !important;
                font-size: .68rem !important;
                letter-spacing: .16em !important;
            }
        }
    </style>
</head>

<body class="bg-sand text-ink antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 border-b border-stone-200/80 bg-sand/95 backdrop-blur">
        <nav class="mx-auto flex h-20 max-w-7xl items-center justify-between px-5 lg:px-8" aria-label="Main navigation">
            <a href="index.html" class="flex items-center gap-3" aria-label="Harista Interiors home">
                <img src="assests/logo.png" alt="Harista Interiors" class="logo-image h-10 w-10 object-contain" />
                <span class="leading-none">
                    <span>
                        <span>HARISTA</span>
                        <span>INTERIORS</span>
                    </span>
                </span> </a>
            <div class="hidden items-center gap-7 text-sm font-medium md:flex">
                <a class="transition hover:text-oak" href="index.html">Home</a>
                <a class="transition hover:text-oak" href="our-work.html">Our Work</a>
            </div>
        </nav>
    </header>

    <!-- Login Section -->
    <main style="padding-top: 6.5rem;">
        <section class="flex min-h-[calc(100vh-6.5rem)] items-center justify-center px-4 py-12">
            <div class="login-card w-full max-w-md p-8 sm:p-10">
                <!-- Header -->
                <div class="mb-10 text-center">
                    <p class="text-xs font-bold uppercase tracking-[.22em] text-oak">Admin Panel</p>
                    <h1 class="display mt-3 text-3xl leading-tight sm:text-4xl">Welcome Back</h1>
                    <p class="mt-3 text-sm text-oat">Sign in to manage your portfolio</p>
                </div>

                <!-- Error Alert -->
                <div id="login-error" class="error-alert mb-6 hidden px-4 py-3 text-sm">
                    <span id="login-error-text">Invalid credentials</span>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-5">
                    <div>
                        <label for="username" class="mb-2 block text-xs font-bold uppercase tracking-[.15em] text-oak">Username</label>
                        <div class="relative">
                            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                                <svg class="h-4 w-4 text-oat" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            </div>
                            <input type="text" id="username" class="login-input" placeholder="Enter your username" autocomplete="username" required>
                        </div>
                    </div>

                    <div>
                        <label for="password" class="mb-2 block text-xs font-bold uppercase tracking-[.15em] text-oak">Password</label>
                        <div class="relative">
                            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                                <svg class="h-4 w-4 text-oat" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                            </div>
                            <input type="password" id="password" class="login-input" placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" id="toggle-password" aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-4 text-oat transition hover:text-ink">
                                <svg class="h-4 w-4" id="eye-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="login-btn mt-2 flex w-full items-center justify-center gap-2 px-6 py-3.5 text-sm font-semibold">
                        <span id="login-btn-text">Sign In</span>
                        <span id="login-btn-arrow">↗</span>
                        <svg id="login-spinner" class="hidden h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                    </button>
                </form>

                <!-- Back to site -->
                <div class="mt-8 text-center">
                    <a href="index.html" class="text-sm text-oat transition hover:text-ink">← Back to Website</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_URL = window.location.protocol === 'file:' ? 'http://localhost:5000/api' : '/api';

        // Check if already logged in
        (function checkAuth() {
            const token = localStorage.getItem('adminToken');
            if (token) {
                fetch(`${API_URL}/auth/verify`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => {
                    if (res.ok) window.location.href = 'admin.html';
                    else { localStorage.removeItem('adminToken'); localStorage.removeItem('adminUser'); }
                })
                .catch(() => {});
            }
        })();

        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input = document.getElementById('password');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });

        // Login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('login-btn-text');
            const btnArrow = document.getElementById('login-btn-arrow');
            const spinner = document.getElementById('login-spinner');
            const error = document.getElementById('login-error');
            const errorText = document.getElementById('login-error-text');

            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            btnArrow.classList.add('hidden');
            spinner.classList.remove('hidden');
            error.classList.add('hidden');

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', data.username);
                    window.location.href = 'admin.html';
                } else {
                    error.classList.remove('hidden');
                    errorText.textContent = data.message || 'Invalid credentials. Please try again.';
                }
            } catch (err) {
                error.classList.remove('hidden');
                errorText.textContent = 'Connection error. Please make sure the server is running.';
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Sign In';
                btnArrow.classList.remove('hidden');
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
